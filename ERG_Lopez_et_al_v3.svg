  <title
     id="title">ERG — Bauhaus-inspired AML research banner</title>
  <desc
     id="desc">An asymmetric red, charcoal and ivory composition with bold geometric typography and an abstract AML blast. A large circular nucleus, three round nucleoli and a narrow cytoplasmic rim suggest immature blast morphology. Decorative geometry is not quantitative data; the illustration is not diagnostic.</desc>
  <metadata
     id="metadata1">Created 2026-10-06. Parent: ERG_Lopez_et_al_scientific_banner_red_v2.svg. Study wording from /home/gusti/Desktop/ERG_Lopez_et_al/README.md. Original vector artwork; no patient data. Bauhaus-inspired revision, not a historical reproduction.<rdf:RDF>
