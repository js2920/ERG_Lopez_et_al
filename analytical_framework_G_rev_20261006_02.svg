  <title
     id="title">Integrated hematopoietic landscape and patient-resolved AML analysis</title>
  <desc
     id="description">Adult and fetal hematopoietic references and pediatric AML are integrated with scVI and scANVI. Original expression and saved scores are aligned to the integrated cells in a complete AnnData resource. The resource supports observed ERG and LSC17 analysis, reference mapping, and paired patient diagnosis and relapse views. Expression originates from source counts, not from the embedding.</desc>
